name: Deploy to GitHub Pages

on:
  # Activa el workflow cada vez que hay un push a la rama `main`
  push:
    branches: [ main ]
  # Te permite ejecutar este workflow manualmente desde la pestaña Actions en GitHub.
  workflow_dispatch:

# Permite clonar el repositorio y desplegar el proyecto
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install, build, and upload your site
        # withastro/action@v6.1.2
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v5.0.0
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346